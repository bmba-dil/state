[project]
name = "state"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0",
    "litellm>=1.80.0",
    "anthropic>=0.80.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.7",
    "orjson>=3.11.8",
    "aiosqlite>=0.22.1",
    "filelock>=3.20.3",
    "pluggy>=1.6.0",
    "python-ulid>=3.0",
    "pygit2>=1.19.2",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-genai>=0.9",
    "openai>=1.60",
    "cryptography>=43.0",
    "structlog>=25.1",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "pytest-httpx>=0.35",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "pytest-xdist>=3.6",
    "ruff>=0.9.0",
    "mypy>=1.14",
    "pre-commit>=4.0",
]
mcp = ["mcp[cli]>=1.27.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
explicit_package_bases = true
namespace_packages = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
    "provider_parity: tests that run against live providers",
    "integration: multi-process or cross-process tests (deselect with '-m \"not integration\"')",
    "slow: tests that intentionally wait for timeouts (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = [
    "state_core",
    "state_build",
    "state_teach",
    "state_daemon",
    "state_worker",
    "state_cli",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/state_core",
    "src/state_build",
    "src/state_teach",
    "src/state_daemon",
    "src/state_worker",
    "src/state_cli",
]
